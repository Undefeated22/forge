name: Native (TFHE addon)

# The compiled addon (native/index.linux-x64-gnu.node) is committed because
# Railway deploys straight from the repo without a Rust toolchain. This
# workflow keeps that blob honest: any change to the Rust source must still
# compile, so source/binary drift gets caught at PR time instead of at runtime.
on:
  push:
    branches: [main, master]
    paths: ["native/**"]
  pull_request:
    branches: [main, master]
    paths: ["native/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native crate
        run: cargo build --release --manifest-path native/Cargo.toml
